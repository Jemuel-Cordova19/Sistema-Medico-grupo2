<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Gestión de Pacientes</title><link rel="stylesheet" href="../css/styles.css"></head>
<body><div class="container"><h1>Gestión de Pacientes</h1><p>Módulo de Melissa</p><a href="recepcion_melissa.html" class="btn">Volver</a>
    <!-- Formulario para ingresar un nuevo paciente -->
        <div class="seccion-formulario" style="margin-top: 20px;">
            <h3>Ingresar Nuevo Paciente</h3>
            <form id="form-paciente">
                <input type="text" placeholder="Nombre Completo" required><br><br>
                <input type="number" placeholder="Edad" required><br><br>
                <input type="text" placeholder="Teléfono de Contacto" required><br><br>
                <input type="text" placeholder="Cédula / DPI" required><br><br>
                <button type="submit">Registrar Paciente</button>
            </form>
        </div>

        <!-- Tabla para listar los pacientes guardados -->
        <div class="seccion-tabla" style="margin-top: 30px;">
            <h3>Listado de Pacientes Registrados</h3>
            <table border="1" style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Edad</th>
                        <th>Teléfono</th>
                        <th>DPI / Identificación</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Aquí se cargarán los pacientes dinámicamente -->
                </tbody>
            </table>
        </div>

    </div>
</body>
</html>
