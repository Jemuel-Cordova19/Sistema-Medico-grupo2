<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Agenda de Citas</title><link rel="stylesheet" href="../css/styles.css"></head>
<body><div class="container"><h1>Agenda de Citas</h1><p>Módulo de Melissa</p><a href="recepcion_melissa.html" class="btn">Volver</a>
    <!-- Formulario para registrar una nueva cita -->
        <div class="seccion-formulario" style="margin-top: 20px;">
            <h3>Agendar Nueva Cita</h3>
            <form id="form-cita">
                <input type="text" placeholder="Nombre del Paciente" required><br><br>
                <input type="date" required><br><br>
                <input type="time" required><br><br>
                <textarea placeholder="Motivo de la cita" required></textarea><br><br>
                <button type="submit">Registrar Cita</button>
            </form>
        </div>

        <!-- Tabla para visualizar las citas agendadas -->
        <div class="seccion-tabla" style="margin-top: 30px;">
            <h3>Citas Programadas</h3>
            <table border="1" style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr>
                        <th>Paciente</th>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Motivo</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Aquí se cargarán dinámicamente los registros -->
                </tbody>
            </table>
        </div>

    </div>
</body>
</html>
