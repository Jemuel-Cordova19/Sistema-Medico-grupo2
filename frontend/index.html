<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Inicio de Sesión - Sistema Médico</title>
    <style>
        /* Estilos básicos para centrar el formulario y darle diseño */
        .contenedor_principal_login {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f3f4f6;
            font-family: Arial, sans-serif;
        }
        .tarjeta_formulario {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .grupo_entrada_datos {
            margin-bottom: 15px;
            position: relative;
        }
        .etiqueta_campo {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .campo_texto {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .boton_alternar_contrasena {
            position: absolute;
            right: 10px;
            top: 32px;
            background: none;
            border: none;
            cursor: pointer;
            color: #007bff;
        }
        .boton_iniciar_sesion {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .mensaje_error_login {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            display: none; /* Oculto por defecto */
        }
    </style>
</head>
<body>

    <!-- Contenedor principal que centra todo en la pantalla -->
    <div class="contenedor_principal_login">
        
        <!-- Tarjeta blanca que contiene el formulario -->
        <div class="tarjeta_formulario">
            <h2 style="text-align: center;">Acceso al Sistema</h2>
            
            <!-- Formulario de inicio de sesión -->
            <form id="formulario_autenticacion">
                
                <!-- Grupo para el correo o nombre de usuario -->
                <div class="grupo_entrada_datos">
                    <label for="identificador_usuario" class="etiqueta_campo">Correo o Usuario:</label>
                    <!-- Campo de texto flexible para recibir email o usuario -->
                    <input type="text" id="identificador_usuario" class="campo_texto" placeholder="Ingrese su correo o usuario" required>
                </div>

                <!-- Grupo para la contraseña -->
                <div class="grupo_entrada_datos">
                    <label for="contrasena_usuario" class="etiqueta_campo">Contraseña:</label>
                    <!-- Campo de contraseña oculto por defecto -->
                    <input type="password" id="contrasena_usuario" class="campo_texto" placeholder="Ingrese su contraseña" required>
                    <!-- Botón para mostrar u ocultar la contraseña -->
                    <button type="button" id="boton_alternar_contrasena" class="boton_alternar_contrasena">Mostrar</button>
                </div>

                <!-- Contenedor para mostrar mensajes de error si las credenciales fallan -->
                <div id="mensaje_error_login" class="mensaje_error_login"></div>

                <!-- Botón principal para enviar los datos -->
                <button type="submit" class="boton_iniciar_sesion">Iniciar Sesión</button>
                
            </form>
        </div>
    </div>

    <!-- Enlace al archivo de lógica JavaScript -->
    <script src="js/auth.js"></script>
</body>
</html>
